<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">تأكيد البريد الإلكتروني - منصة P2P</title>

    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Shared Supabase Configuration -->
    <script src="supabase-config.js"></script>
    <!-- Shared Translation Script -->
    <script src="language.js"></script>
    <style>
        /* ==========================================
           1. الإعدادات العامة (أزرق وأبيض)
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f6ff;
            color: #1e3a8a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            position: relative;
            overflow-x: hidden;
        }
        /* ==========================================
           2. نظام التنبيهات المنبثقة (Toast)
           ========================================== */
        .toast-notification-box {
            position: fixed;
            top: 20px;
            right: 50%;
            transform: translateX(50%) translateY(-100px);
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 320px;
            max-width: 90%;
            padding: 14px 20px;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.15);
            border-right: 5px solid #2563eb;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            z-index: 9999;
            pointer-events: none;
        }

        html[dir="ltr"] .toast-notification-box {
            border-right: none;
            border-left: 5px solid #2563eb;
        }

        .toast-notification-box.active-toast {
            transform: translateX(50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* رسالة الخطأ */
        .toast-notification-box.toast-error-style {
            border-right-color: #ef4444;
            background-color: #fef2f2;
        }
        html[dir="ltr"] .toast-notification-box.toast-error-style {
            border-left-color: #ef4444;
        }
        .toast-notification-box.toast-error-style .toast-status-icon {
            background-color: #ef4444;
        }
        .toast-notification-box.toast-error-style .toast-head-title {
            color: #991b1b;
        }
        .toast-notification-box.toast-error-style .toast-body-message {
            color: #dc2626;
        }

        /* رسالة النجاح */
        .toast-notification-box.toast-success-style {
            border-right-color: #16a34a;
            background-color: #f0fdf4;
        }
        html[dir="ltr"] .toast-notification-box.toast-success-style {
            border-left-color: #16a34a;
        }
        .toast-notification-box.toast-success-style .toast-status-icon {
            background-color: #16a34a;
        }
        .toast-notification-box.toast-success-style .toast-head-title {
            color: #14532d;
        }
        .toast-notification-box.toast-success-style .toast-body-message {
            color: #16a34a;
        }

        .toast-status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .toast-content-wrapper {
            flex-grow: 1;
        }

        .toast-head-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .toast-body-message {
            font-size: 12px;
        }

        .toast-close-button {
            background: none;
            border: none;
            color: #1e3a8a;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            opacity: 0.6;
        }

        .toast-close-button:hover {
            opacity: 1;
        }

        /* ==========================================
           3. بطاقة التحقق من البريد
           ========================================== */
        .verify-card-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.08);
            border: 1px solid #dbeafe;
        }

        .brand-header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .p2p-brand-logo {
            width: 56px;
            height: 56px;
            background-color: #2563eb;
            border-radius: 16px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }

        .main-portal-title {
            font-size: 22px;
            color: #1e3a8a;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .sub-portal-title {
            color: #3b82f6;
            font-size: 13px;
            line-height: 1.5;
        }

        .user-email-highlight {
            font-weight: 700;
            color: #1e3a8a;
            direction: ltr;
            display: inline-block;
        }

        /* مربعات الـ OTP الستة */
        .otp-input-wrapper {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 20px 0 16px 0;
            direction: ltr;
        }

        .otp-digit-field {
            width: 48px;
            height: 52px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            border: 1.5px solid #bfdbfe;
            border-radius: 10px;
            background-color: #f8fafc;
            color: #1e3a8a;
            outline: none;
            transition: all 0.2s ease;
        }

        .otp-digit-field:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .submit-verify-button {
            width: 100%;
            padding: 13px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            margin-bottom: 20px;
        }.submit-verify-button:hover {
            background-color: #1d4ed8;
        }

        .submit-verify-button:active {
            transform: scale(0.99);
        }

        .submit-verify-button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ==========================================
           4. مربع اختبار التحقق الإنساني (Bot Check)
           ========================================== */
        .captcha-challenge-box {
            background-color: #f8fafc;
            border: 1.5px solid #bfdbfe;
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .captcha-left-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .captcha-checkbox-input {
            width: 20px;
            height: 20px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .captcha-label-text {
            font-size: 13px;
            font-weight: 600;
            color: #1e3a8a;
            cursor: pointer;
            user-select: none;
        }

        .captcha-brand-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .captcha-icon-graphic {
            width: 20px;
            height: 20px;
            border: 2px solid #2563eb;
            border-radius: 50%;
            border-top-color: transparent;
            transform: rotate(45deg);
        }

        .captcha-subtext {
            font-size: 9px;
            color: #3b82f6;
            margin-top: 2px;
            font-weight: 600;
        }

        .resend-box {
            text-align: center;
            font-size: 13px;
            color: #1e3a8a;
            margin-bottom: 16px;
        }

        .resend-button {
            background: none;
            border: none;
            color: #2563eb;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            padding: 0;
            margin-right: 4px;
            margin-left: 4px;
        }

        .resend-button:disabled {
            color: #94a3b8;
            cursor: not-allowed;
        }

        .card-footer-section {
            text-align: center;
            border-top: 1px solid #edf2f7;
            padding-top: 18px;
            font-size: 13px;
            color: #1e3a8a;
        }

        .back-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- التنبيه المنبثق العلوي (Toast) -->
    <div id="toastNotificationBox" class="toast-notification-box">
        <div id="toastStatusIcon" class="toast-status-icon">✓</div>
        <div class="toast-content-wrapper">
            <div id="toastHeadTitle" class="toast-head-title" data-i18n="defaultToastTitle">تنبيه</div>
            <div id="toastBodyMessage" class="toast-body-message" data-i18n="defaultToastMessage">رسالة التنبيه هنا</div>
        </div>
        <button type="button" id="toastCloseButton" class="toast-close-button" data-i18n-aria-label="toastCloseAriaLabel">✕</button>
    </div>

    <!-- بطاقة التحقق من البريد -->
    <div class="verify-card-container">
        <div class="brand-header-section">
            <div class="p2p-brand-logo">P2P</div>
            <h1 class="main-portal-title" data-i18n="emailVerifyTitle">تأكيد البريد الإلكتروني</h1>
            <p class="sub-portal-title">
                <span data-i18n="emailVerifySubtitle">أدخل رمز التحقق المكون من 6 أرقام المرسل إلى</span><br>
                <span id="targetEmailDisplay" class="user-email-highlight">جاري التحميل...</span>
            </p>
        </div>
        
        <form id="p2pVerifyForm">
            <!-- حقول أدخل رمز التحقق الـ 6 -->
            <div class="otp-input-wrapper">
                <input type="text" inputmode="numeric" class="otp-digit-field" autocomplete="off" required>
                <input type="text" inputmode="numeric" class="otp-digit-field" autocomplete="off" required>
                <input type="text" inputmode="numeric" class="otp-digit-field" autocomplete="off" required>
                <input type="text" inputmode="numeric" class="otp-digit-field" autocomplete="off" required>
                <input type="text" inputmode="numeric" class="otp-digit-field" autocomplete="off" required>
                <input type="text" inputmode="numeric" class="otp-digit-field" autocomplete="off" required>
            </div>

            <!-- زر التحقق من الرمز -->
            <button type="submit" id="submitVerifyButton" class="submit-verify-button" data-i18n="btnVerifyEmail">التحقق من الرمز</button>

            <!-- مربع اختبار التحقق الإنساني (Bot Check) -->
            <div class="captcha-challenge-box">
                <div class="captcha-left-content">
                    <input type="checkbox" id="humanVerificationCheckbox" class="captcha-checkbox-input">
                    <label for="humanVerificationCheckbox" class="captcha-label-text" data-i18n="captchaLabel">أنا لست برنامج روبوت</label>
                </div>
                <div class="captcha-brand-badge">
                    <div class="captcha-icon-graphic"></div>
                    <span class="captcha-subtext" data-i18n="captchaSubtext">حماية P2P</span>
                </div>
            </div>
        </form>

        <div class="resend-box">
            <span data-i18n="resendTextPrompt">لم يصلك الرمز؟</span>
            <button type="button" id="resendCodeBtn" class="resend-button" disabled><span id="resendBtnTextPrefix" data-i18n="resendBtnPrefix">إعادة الإرسال</span> (<span id="timerCountdown"></span><span id="timerUnitText" data-i18n="timerUnit">ث</span>)</button>
        </div>

        <div class="card-footer-section">
            <p><a href="index.html" class="back-link" data-i18n="loginLink">العودة لتسجيل الدخول</a></p>
        </div>
    </div>

    <script>
        // ==========================================
        // الترجمة المركزية
        // ==========================================
        function _t(key, fallback) {
            try {
                if (typeof window.translateKey === 'function') {
                    const v = window.translateKey(key);
                    if (v && v !== key) return v;
                }
            } catch (_) {}
            return fallback;
        }

        // ==========================================
        // 1. تهيئة Supabase
        // ==========================================
        const supabaseClient = (typeof window.supabaseClient !== 'undefined' && window.supabaseClient)
            ? window.supabaseClient
            : null;

        // ==========================================
        // 2. العناصر المحددة
        // ==========================================
        const p2pVerifyForm = document.getElementById('p2pVerifyForm');
        const otpInputs = Array.from(document.querySelectorAll('.otp-digit-field'));
        const submitVerifyButton = document.getElementById('submitVerifyButton');
        const humanVerificationCheckbox = document.getElementById('humanVerificationCheckbox');
        const resendCodeBtn = document.getElementById('resendCodeBtn');
        const targetEmailDisplay = document.getElementById('targetEmailDisplay');

        // التعديل 1: إزالة البريد البديل name@example.com
        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email'); 

        if (userEmail) {
            targetEmailDisplay.textContent = userEmail;
        } else {
            targetEmailDisplay.textContent = "البريد غير موجود";
            targetEmailDisplay.style.color = "#ef4444";
            submitVerifyButton.disabled = true;
            resendCodeBtn.disabled = true;
        }

        // التنبيهات المنبثقة
        const toastNotificationBox = document.getElementById('toastNotificationBox');
        const toastHeadTitle = document.getElementById('toastHeadTitle');
        const toastBodyMessage = document.getElementById('toastBodyMessage');
        const toastStatusIcon = document.getElementById('toastStatusIcon');
        const toastCloseButton = document.getElementById('toastCloseButton');

        let toastTimer = null;

        // ==========================================
        // 3. نظام التنبيهات المنبثقة Toast
        // ==========================================
        function triggerToastNotification(title, message, type = 'success') {
            clearTimeout(toastTimer);
            toastHeadTitle.textContent = title;
            toastBodyMessage.textContent = message;

            if (type === 'error') {
                toastNotificationBox.className = 'toast-notification-box active-toast toast-error-style';
                toastStatusIcon.textContent = '✕';
            } else {
                toastNotificationBox.className = 'toast-notification-box active-toast toast-success-style';
                toastStatusIcon.textContent = '✓';
            }

            toastTimer = setTimeout(() => {
                closeToastNotification();
            }, 4500);
        }

        function closeToastNotification() {
            toastNotificationBox.classList.remove('active-toast');
        }

        toastCloseButton.addEventListener('click', closeToastNotification);

        // ==========================================
        // 4. المحرك الأساسي للإدخال: أرقام فقط + تنقل + لصق كلي
        // ==========================================
        otpInputs.forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                const allowedKeys = ['Backspace', 'ArrowLeft', 'ArrowRight', 'Tab', 'Delete'];
                if ((e.ctrlKey || e.metaKey) && ['v', 'c', 'a', 'x'].includes(e.key.toLowerCase())) return;

                if (allowedKeys.includes(e.key)) {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                    return;
                }
                if (!/^[0-9]$/.test(e.key)) e.preventDefault();
            });

            input.addEventListener('input', (e) => {
                let val = input.value.replace(/\D/g, '');
                if (val.length > 0) {
                    input.value = val[val.length - 1];
                    if (index < otpInputs.length - 1) otpInputs[index + 1].focus();
                } else {
                    input.value = '';
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                const digits = pasteData.replace(/\D/g, '').slice(0, 6);

                if (digits.length > 0) {
                    digits.split('').forEach((char, i) => {
                        if (otpInputs[i]) otpInputs[i].value = char;
                    });
                    const targetIndex = Math.min(digits.length, otpInputs.length - 1);
                    otpInputs[targetIndex].focus();
                } else {
                    triggerToastNotification(
                        _t('pasteErrorTitle', 'خطأ في اللصق'),
                        _t('pasteErrorMessage', 'الرجاء لصق أرقام فقط'),
                        'error'
                    );
                }
            });
        });

        // ==========================================
        // 5. العداد لإعادة الإرسال (30 ثانية)
        // ==========================================
        function startResendTimer() {
            if (!userEmail) return; // التعديل 2: منع العداد إذا لم يوجد بريد

            let timeLeft = 30;
            resendCodeBtn.disabled = true;

            const prefixText = _t('resendBtnPrefix', 'إعادة الإرسال');
            const unitText = _t('timerUnit', 'ث');

            resendCodeBtn.innerHTML = `<span id="resendBtnTextPrefix" data-i18n="resendBtnPrefix">${prefixText}</span> (<span id="timerCountdown">${timeLeft}</span><span id="timerUnitText" data-i18n="timerUnit">${unitText}</span>)`;

            if (window.countdownTimer) {
                clearInterval(window.countdownTimer);
            }

            window.countdownTimer = setInterval(() => {
                timeLeft--;
                const activeCountdownSpan = document.getElementById('timerCountdown');
                
                if (activeCountdownSpan) {
              activeCountdownSpan.textContent = timeLeft;
                }

                if (timeLeft <= 0) {
                    clearInterval(window.countdownTimer);
                    resendCodeBtn.disabled = false;
                    const resendNowText = _t('resendNow', 'إعادة الإرسال الآن');
                    resendCodeBtn.innerHTML = resendNowText;
                }
            }, 1000);
        }

        if (userEmail) {
            startResendTimer();
        }

        // ==========================================
        // 6. إعادة إرسال الرمز
        // ==========================================
        resendCodeBtn.addEventListener('click', async () => {
            // التعديل 3: حماية إضافية من إعادة الإرسال بدون بريد
            if (!userEmail) {
                triggerToastNotification(_t('otpErrorTitle', 'خطأ'), 'البريد الإلكتروني غير موجود في الرابط.', 'error');
                return;
            }

            if (!supabaseClient) {
                triggerToastNotification(
                    _t('resendFailedTitle', 'فشل إعادة الإرسال'),
                    _t('serviceUnavailable', 'الخدمة غير متاحة حالياً، يرجى المحاولة لاحقاً.'),
                    'error'
                );
                return;
            }
            const { error } = await supabaseClient.auth.resend({
                type: 'signup',
                email: userEmail
            });
            if (error) {
                triggerToastNotification(_t('resendFailedTitle', 'فشل إعادة الإرسال'), error.message, 'error');
                return;
            }
            triggerToastNotification(
                _t('resendSuccessTitle', 'تم إعادة الإرسال'),
                _t('resendSuccessMsg', 'تم إرسال رمز جديد إلى بريدك الإلكتروني.'),
                'success'
            );
            startResendTimer();
        });

        // ==========================================
        // 7. التحقق عبر Supabase
        // ==========================================
        p2pVerifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // التعديل 4: منع التحقق إذا لم يوجد بريد في الرابط
            if (!userEmail) {
                triggerToastNotification(_t('otpErrorTitle', 'خطأ'), 'البريد الإلكتروني غير موجود في الرابط. لا يمكن إتمام التحقق.', 'error');
                return;
            }

            let otpCode = otpInputs.map(input => input.value.trim()).join('');

            if (otpCode.length !== 6) {
                triggerToastNotification(
                    _t('incompleteOtpTitle', 'رمز غير مكتمل'),
                    _t('incompleteOtpMsg', 'يرجى إدخال جميع الأرقام الستة.'),
                    'error'
                );
                return;
            }

            if (!humanVerificationCheckbox.checked) {
                triggerToastNotification(
                    _t('captchaFailedTitle', 'التحقق مطلوب'),
                    _t('captchaFailedMsg', 'يرجى تأكيد أنك لست روبوتاً.'),
                    'error'
                );
                return;
            }

            if (!supabaseClient) {
                triggerToastNotification(
                    _t('otpErrorTitle', 'خطأ'),
                    _t('serviceUnavailable', 'الخدمة غير متاحة حالياً، يرجى المحاولة لاحقاً.'),
                    'error'
                );
                return;
            }

            submitVerifyButton.disabled = true;
            submitVerifyButton.textContent = _t('btnVerifying', 'جارٍ التحقق...');

            try {
                const { data, error } = await supabaseClient.auth.verifyOtp({
                    email: userEmail,
                    token: otpCode,
                    type: 'signup'
                });

                if (error) {
                    throw new Error(error.message || _t('verifyInvalidRealErr', 'رمز التحقق غير صالح.'));
                }

                triggerToastNotification(
                    _t('verifySuccessTitle', 'تم التحقق بنجاح'),
                    _t('verifySuccessMsgReal', 'تم تأكيد بريدك الإلكتروني بنجاح. جارٍ تحويلك...'),
                    'success'
                );
                
                setTimeout(() => {
                    window.location.href = 'index_login.html';
                }, 2000);
            } catch (err) {
                triggerToastNotification(_t('otpErrorTitle', 'خطأ'), err.message, 'error');
            } finally {
                submitVerifyButton.disabled = false;
                submitVerifyButton.textContent = _t('btnVerifyEmail', 'التحقق من الرمز');
            }
        });

        // ==========================================
        // 8. إعادة تطبيق الترجمة عند تغيير اللغة
        // ==========================================
        document.addEventListener('zal:languageChanged', () => {
            if (typeof window.translateKey !== 'function') return;

            const prefixEl = document.getElementById('resendBtnTextPrefix');
            const unitEl = document.getElementById('timerUnitText');
            if (prefixEl) prefixEl.textContent = window.translateKey('resendBtnPrefix');
            if (unitEl) unitEl.textContent = window.translateKey('timerUnit');

            if (!resendCodeBtn.disabled && !document.getElementById('timerCountdown')) {
                resendCodeBtn.innerHTML = window.translateKey('resendNow');
            }

            if (submitVerifyButton.disabled) {
                submitVerifyButton.textContent = window.translateKey('btnVerifying');
            } else {
                submitVerifyButton.textContent = window.translateKey('btnVerifyEmail');
            }
        });
    </script>

</body>
</html>
