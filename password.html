<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="changePassword.pageTitle">تغيير كلمة المرور</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="language.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f6ff;
            padding: 20px;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.08);
            border: 1px solid #dbeafe;
            transition: 0.25s;
        }
        .card h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2::before {
            content: "🔑";
            font-size: 24px;
        }
        .field {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field label {
            font-size: 13px;
            font-weight: 600;
            color: #1e3a8a;
            letter-spacing: 0.3px;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            width: 100%;
            padding: 13px 48px 13px 16px;
            border: 1.5px solid #bfdbfe;
            border-radius: 14px;
            font-size: 14px;
            background: #fafcff;
            color: #1e3a8a;
            outline: none;
            transition: 0.2s;
        }
        .password-wrapper input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
        }
        .password-wrapper input.error {
            border-color: #dc2626;
            background: #fef2f2;
        }
        .toggle-vis {
            position: absolute;
            left: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            color: #94a3b8;
            width: 32px;
            height: 32px;
        }
        .toggle-vis:hover {
            background: #eef2ff;
            color: #2563eb;
        }
        .toggle-vis:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }
        .toggle-vis svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.2);
            margin-top: 8px;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: scale(1.01);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .field-error {
            font-size: 13px;
            font-weight: 500;
            color: #dc2626;
            background: #fef2f2;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #fecaca;
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .field-error.show {
            display: flex;
        }
        .field-error svg {
            width: 16px;
            height: 16px;
            stroke: #dc2626;
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .toast-container {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transform: translateX(calc(100% + 40px));
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            border-right: 4px solid #2563eb;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast.hide {
            transform: translateX(calc(100% + 40px));
            opacity: 0;
        }
        .toast.success {
            border-right-color: #16a34a;
        }
        .toast.error {
            border-right-color: #dc2626;
        }
        .toast-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            margin-top: 2px;
        }
        .toast-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .toast.success .toast-icon svg {
            stroke: #16a34a;
        }
        .toast.error .toast-icon svg {
            stroke: #dc2626;
        }
        .toast-content {
            flex: 1;
            min-width: 0;
        }
        .toast-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .toast-message {
            font-size: 13px;
            color: #475569;
            line-height: 1.4;
        }
        .toast-close {
            flex-shrink: 0;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #94a3b8;
            border-radius: 6px;
            transition: 0.15s;
            margin-top: -2px;
        }
        .toast-close:hover {
            background: #f1f5f9;
            color: #475569;
        }
        .toast-close svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 16px;
            }
            .card h2 {
                font-size: 20px;
            }
            .password-wrapper input {
                padding: 12px 44px 12px 14px;
                font-size: 13px;
            }
            .toggle-vis {
                width: 28px;
                height: 28px;
                left: 10px;
            }
            .toggle-vis svg {
                width: 18px;
                height: 18px;
            }
            .toast-container {
                top: 16px;
                left: 16px;
                right: 16px;
                max-width: none;
            }
            .toast {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 data-i18n="changePassword.title">تغيير كلمة المرور</h2>

        <!-- حقل كلمة المرور الجديدة -->
        <div class="field">
            <label data-i18n="changePassword.newPasswordLabel">كلمة المرور الجديدة</label>
            <div class="password-wrapper">
                <input type="password" id="newPassword" placeholder="********" data-i18n-placeholder="changePassword.newPasswordPlaceholder" />
                <button type="button" class="toggle-vis" id="toggleNew" aria-label="إظهار / إخفاء كلمة المرور" data-i18n-aria-label="changePassword.togglePassword">
                    <svg viewBox="0 0 24 24" id="eyeIconNew">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div class="field-error" id="newPasswordError">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span data-i18n="changePassword.newPasswordRequired">كلمة المرور الجديدة مطلوبة</span>
            </div>
        </div>

        <!-- حقل تأكيد كلمة المرور -->
        <div class="field">
            <label data-i18n="changePassword.confirmLabel">تأكيد كلمة المرور</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="********" data-i18n-placeholder="changePassword.confirmPlaceholder" />
                <button type="button" class="toggle-vis" id="toggleConfirm" aria-label="إظهار / إخفاء كلمة المرور" data-i18n-aria-label="changePassword.togglePassword">
                    <svg viewBox="0 0 24 24" id="eyeIconConfirm">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div class="field-error" id="confirmPasswordError">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span data-i18n="changePassword.confirmPasswordRequired">تأكيد كلمة المرور مطلوب</span>
            </div>
        </div>

        <!-- زر تغيير كلمة المرور -->
        <button class="btn-primary" id="changeBtn" data-i18n="changePassword.button">تغيير كلمة المرور</button>
    </div>

    <div class="toast-container" id="toastContainer"></div>

<script>
    // ================================================================
    //  1. عميل Supabase الموحّد (من supabase-config.js)
    // ================================================================
    const supabaseClient = (typeof window.supabaseClient !== 'undefined' && window.supabaseClient)
        ? window.supabaseClient
        : null;

    // ================================================================
    //  2. عناصر DOM
    // ================================================================
    const newPassInput = document.getElementById('newPassword');
    const confirmInput = document.getElementById('confirmPassword');
    const toggleNewBtn = document.getElementById('toggleNew');
    const toggleConfirmBtn = document.getElementById('toggleConfirm');
    const changeBtn = document.getElementById('changeBtn');
    const newPassError = document.getElementById('newPasswordError');
    const confirmError = document.getElementById('confirmPasswordError');
    const toastContainer = document.getElementById('toastContainer');

    // ================================================================
    //  3. دوال عرض وإخفاء رسائل الحقل (تعتمد على النظام المركزي)
    // ================================================================
    function showFieldError(field, key) {
        const span = field === 'new' 
            ? newPassError.querySelector('span[data-i18n]') 
            : confirmError.querySelector('span[data-i18n]');
        
        span.setAttribute('data-i18n', key);
        span.textContent = key; // يضع المفتاح مؤقتاً
        
        if (field === 'new') {
            newPassError.classList.add('show');
            newPassInput.classList.add('error');
        } else if (field === 'confirm') {
            confirmError.classList.add('show');
            confirmInput.classList.add('error');
        }

        // إجبار النظام المركزي على ترجمة العنصر
        if (window.ZALLanguage && typeof window.ZALLanguage.refresh === 'function') {
            window.ZALLanguage.refresh();
        }
    }

    function hideFieldError(field) {
        if (field === 'new') {
            newPassError.classList.remove('show');
            newPassInput.classList.remove('error');
        } else if (field === 'confirm') {
            confirmError.classList.remove('show');
            confirmInput.classList.remove('error');
        }
    }

    function hideAllFieldErrors() {
        hideFieldError('new');
        hideFieldError('confirm');
    }

    // ================================================================
    //  4. نظام Toast الاحترافي (يعتمد على النظام المركزي)
    // ================================================================
    function showToast(type, titleKey, messageKey) {
        const existing = toastContainer.querySelector('.toast');
        if (existing) {
            existing.classList.add('hide');
            setTimeout(() => existing.remove(), 400);
        }

        const toast = document.createElement('div');
        toast.className = `toast ${type}`;

        let iconSVG = '';
        if (type === 'success') {
            iconSVG = `
                <svg viewBox="0 0 24 24">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
            `;
        } else {
            iconSVG = `
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
            `;
        }

        // نضع المفاتيح فقط، والنظام المركزي هو من سيترجمها
        toast.innerHTML = `
            <div class="toast-icon">${iconSVG}</div>
            <div class="toast-content">
                <div class="toast-title" data-i18n="${titleKey}">${titleKey}</div>
                <div class="toast-message" data-i18n="${messageKey}">${messageKey}</div>
            </div>
            <button class="toast-close" aria-label="إغلاق" data-i18n-aria-label="toast.close">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        `;

        toastContainer.appendChild(toast);

        // إجبار النظام المركزي على ترجمة الـ Toast الجديد فوراً
        if (window.ZALLanguage && typeof window.ZALLanguage.refresh === 'function') {
            window.ZALLanguage.refresh();
        }

        toast.querySelector('.toast-close').addEventListener('click', function() {
            toast.classList.add('hide');
            setTimeout(() => toast.remove(), 400);
        });

        requestAnimationFrame(() => {
            toast.classList.add('show');
        });

        const autoHide = setTimeout(() => {
            if (toast.parentNode) {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }
        }, 5000);

        toast.addEventListener('mouseenter', () => clearTimeout(autoHide));
    }

    // ================================================================
    //  5. إظهار / إخفاء كلمة المرور
    // ================================================================
    function togglePasswordVisibility(input, toggleBtn, eyeIconId) {
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');

        const svg = document.getElementById(eyeIconId);
        if (isPassword) {
            svg.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
                <line x1="2" y1="2" x2="22" y2="22" />
            `;
        } else {
            svg.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
            `;
        }
    }

    toggleNewBtn.addEventListener('click', function(e) {
        e.preventDefault();
        togglePasswordVisibility(newPassInput, this, 'eyeIconNew');
    });

    toggleConfirmBtn.addEventListener('click', function(e) {
        e.preventDefault();
        togglePasswordVisibility(confirmInput, this, 'eyeIconConfirm');
    });

    // ================================================================
    //  6. تغيير كلمة المرور الفعلي مع Supabase Auth
    // ================================================================
    changeBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        hideAllFieldErrors();

        if (!supabaseClient) {
            showToast('error', 'changePassword.errorTitle', 'serviceUnavailable');
            return;
        }

        const newPassword = newPassInput.value.trim();
        const confirmPassword = confirmInput.value.trim();

        let hasError = false;

        if (!newPassword) {
            showFieldError('new', 'changePassword.newPasswordRequired');
            hasError = true;
        } else if (newPassword.length < 6) {
            showFieldError('new', 'changePassword.newPasswordTooShort');
            hasError = true;
        }

        if (!confirmPassword) {
            showFieldError('confirm', 'changePassword.confirmPasswordRequired');
            hasError = true;
        }

        if (hasError) return;

        if (newPassword !== confirmPassword) {
            showFieldError('confirm', 'changePassword.passwordMismatch');
            return;
        }

        try {
            changeBtn.disabled = true;
            changeBtn.setAttribute('data-i18n', 'changePassword.updating');
            changeBtn.textContent = 'changePassword.updating'; 
            
            if (window.ZALLanguage && typeof window.ZALLanguage.refresh === 'function') {
                window.ZALLanguage.refresh();
            }

            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                console.warn('Supabase error:', error);
                showToast('error', 'changePassword.errorTitle', 'changePassword.errorMessage');
                changeBtn.disabled = false;
                changeBtn.setAttribute('data-i18n', 'changePassword.button');
                changeBtn.textContent = 'changePassword.button';
                if (window.ZALLanguage && typeof window.ZALLanguage.refresh === 'function') window.ZALLanguage.refresh();
                return;
            }

            showToast('success', 'changePassword.successTitle', 'changePassword.successMessage');

            setTimeout(() => {
                window.location.href = 'settings.html';
            }, 1800);

        } catch (err) {
            console.error('Unexpected error:', err);
            showToast('error', 'changePassword.errorTitle', 'changePassword.errorUnknown');
            changeBtn.disabled = false;
            changeBtn.setAttribute('data-i18n', 'changePassword.button');
            changeBtn.textContent = 'changePassword.button';
            if (window.ZALLanguage && typeof window.ZALLanguage.refresh === 'function') window.ZALLanguage.refresh();
        }
    });

    // ================================================================
    //  6.1 تحديث الرسائل الظاهرة عند تغيير اللغة
    // ================================================================
    document.addEventListener('zal:languageChanged', function () {
        if (window.ZALLanguage && typeof window.ZALLanguage.refresh === 'function') {
            window.ZALLanguage.refresh();
        }
    });

    // ================================================================
    //  7. عند الكتابة نزيل الخطأ
    // ================================================================
    newPassInput.addEventListener('input', function() {
        hideFieldError('new');
    });

    confirmInput.addEventListener('input', function() {
        hideFieldError('confirm');
    });

    // ================================================================
    //  8. تهيئة أولية
    // ================================================================
    hideAllFieldErrors();

    changeBtn.setAttribute('data-i18n', 'changePassword.button');
    newPassInput.setAttribute('data-i18n-placeholder', 'changePassword.newPasswordPlaceholder');
    confirmInput.setAttribute('data-i18n-placeholder', 'changePassword.confirmPlaceholder');
    toggleNewBtn.setAttribute('data-i18n-aria-label', 'changePassword.togglePassword');
    toggleConfirmBtn.setAttribute('data-i18n-aria-label', 'changePassword.togglePassword');
</script>

</body>
</html>
